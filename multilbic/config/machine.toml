# MultiLBIC machine description.
#
# Values that are calibrated or measured live here, not in the code.
# Lengths are millimetres and speeds mm/s, because G-code speaks
# millimetres and every name carries its unit.
#
# Where each value comes from is in docs/hardware.md. "measured = false"
# marks a value that is a placeholder until commissioning (Phase 6).

name = "MultiLBIC"

[ab]
# Raster stage: 1 mm lead screws, 16 microsteps.
steps_per_mm = 3200
travel_mm = 40.0
centre_mm = [17.5, 17.5]
# Near the back edge the motor struggles or the grub screw slips.
safe_min_mm = 0.0
safe_max_mm = 35.0
# Compiled-in Marlin limits. The EEPROM may hold others: check with M503.
max_feed_mm_s = 2.0
max_accel_mm_s2 = 50.0

[xy]
# Carries the whole AB gantry: 2 mm lead screws, 16 microsteps.
steps_per_mm = 400
travel_mm = [100.0, 120.0]
max_feed_mm_s = 20.0
max_accel_mm_s2 = 100.0

# Two groups of three on a 180-degree servo revolver: lasers 1/4, 2/5 and
# 3/6 share an angle, and XY picks the group. xy_centre_mm is where XY
# puts the AB centre under that beam.
[[lasers]]
number = 1
wavelength_nm = 444
servo_angle_deg = 150
xy_centre_mm = [79.6, 71.3]
measured = true

[[lasers]]
number = 2
wavelength_nm = 519
servo_angle_deg = 90
xy_centre_mm = [75.6, 71.7]
measured = true

[[lasers]]
number = 3
wavelength_nm = 652
servo_angle_deg = 30
xy_centre_mm = [75.0, 70.0]
measured = true

[[lasers]]
number = 4
wavelength_nm = 676
servo_angle_deg = 150
xy_centre_mm = [49.4, 43.0]
measured = false

[[lasers]]
number = 5
wavelength_nm = 785
servo_angle_deg = 90
xy_centre_mm = [49.4, 43.0]
measured = false

[[lasers]]
number = 6
wavelength_nm = 848
servo_angle_deg = 30
xy_centre_mm = [50.0, 50.0]
measured = false

# Serial ports per platform (sys.platform). An empty string means "not
# configured", which is normal for a development machine.
#
# On the Pi these are the names Linux makes on its own under
# /dev/serial/by-id, from each board's USB serial number: they survive
# replugging and reboots, and need no udev rules (docs/hardware.md).
[ports.linux]
skr = "/dev/serial/by-id/usb-marlinfw.org_Marlin_USB_Device_1602400395D510E961DB1B78F50020C1-if00"
laser = "/dev/serial/by-id/usb-Seeed_Seeed_XIAO_M0_AC5401405154315432202020FF102436-if00"
tft = "/dev/serial/by-id/usb-FTDI_TTL232R-3V3_FTDKEIR6-if00-port0"
smu = "/dev/serial/by-id/usb-Undalogic_Inc_miniSMU_MS01_lunar-tuvok-7966-if00"

[ports.win32]
skr = ""
laser = ""
tft = ""
smu = ""

[serial]
baud = 115200
