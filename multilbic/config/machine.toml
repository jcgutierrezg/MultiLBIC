# MultiLBIC machine description.
#
# Values that are calibrated or measured live here, not in the code.
# Lengths are millimetres and speeds mm/s, because G-code speaks
# millimetres and every name carries its unit.
#
# Where each value comes from is in docs/hardware.md. "measured = false"
# marks a value that is a placeholder until commissioning (Phase 6).

name = "MultiLBIC"

# Mains pickup is most of the noise on open leads (docs/hardware.md); the
# map's cleaning removes this frequency and its harmonics along each row.
mains_hz = 50.0

[ab]
# Raster stage: 1 mm lead screws, 16 microsteps.
steps_per_mm = 3200
travel_mm = 40.0
# Sensorless homing stops 5 mm short of the hard stop (Marlin's 5 mm
# homing bump, docs/hardware.md), so Marlin's own zero is 5 mm in and its
# far stop at 35. MultiLBIC sends M206 A5 B5 at every connect: once homed,
# A and B read 5, and 0 is the hard stop (checked after every home). All
# A/B coordinates moved by +5 mm with it (2026-10-29, 0.6.17).
home_offset_mm = 5.0
centre_mm = [20.0, 20.0]
# 40 mm between the hard stops (the builder, 2026-10-29); 0.5 mm kept
# clear of each. Marlin's software endstops are off (M211 S0 at every
# connect): these are the only limits.
safe_min_mm = 0.5
safe_max_mm = 39.5
# The ceiling the software will ever command; the scan speed itself is
# chosen per run. 6 mm/s matches the board's EEPROM, and A ran smoothly
# at 3-6 mm/s on the bench (2026-10-20). A and B are mechanically
# identical and share these limits. Compiled-in default: 2 mm/s.
max_feed_mm_s = 6.0
max_accel_mm_s2 = 50.0

[xy]
# Carries the whole AB gantry: 2 mm lead screws, 16 microsteps.
steps_per_mm = 400
# X goes to 105 before its hard stop (the builder, 2026-10-29), but at
# 104 the carriage just touches a cable (bench, 2026-10-30): 103 is the
# limit. Marlin's compiled limit is 100; its software endstops are off,
# so this is the only limit.
travel_mm = [103.0, 120.0]
max_feed_mm_s = 20.0
max_accel_mm_s2 = 100.0

# Two groups of three on a 180-degree servo revolver: lasers 1/4, 2/5 and
# 3/6 share an angle, and XY picks the group. xy_centre_mm is where XY
# puts the AB centre under that beam.
# spot_um: the spot's size, the 10-90 % width of an edge scanned through
# it, along A on the blade at the sample's height. Lasers 1-3 and
# their positions against laser 2 from `multilbic commission` across
# the blades (2026-10-30, 0.6.22), after the stage was lowered 1 cm and
# refocused by eye: lasers 1 and 2 were 65 and 41 um on the old stage
# (the test cell's edge, 2026-10-23), laser 3 244 um. Each is narrower
# on the upper blade, 0.4 mm higher (48, 22, 20 um): the waist is above
# the sample's plane, or the spot is astigmatic. Left out where unknown.
# The window compares it with the row pitch; nothing else uses it yet.

[[lasers]]
number = 1
wavelength_nm = 444
servo_angle_deg = 150
xy_centre_mm = [79.002, 72.586]  # commission 2026-10-30
measured = true  # commission 2026-10-30
spot_um = 59.4  # commission 2026-10-30

[[lasers]]
number = 2
wavelength_nm = 519
servo_angle_deg = 90
xy_centre_mm = [75.600, 71.700]  # commission 2026-10-30
measured = true  # commission 2026-10-30
spot_um = 39.3  # commission 2026-10-30

[[lasers]]
number = 3
wavelength_nm = 652
servo_angle_deg = 30
xy_centre_mm = [74.600, 70.072]  # commission 2026-10-30
measured = true  # commission 2026-10-30
spot_um = 30.9  # commission 2026-10-30

[[lasers]]
number = 4
wavelength_nm = 676
servo_angle_deg = 150
xy_centre_mm = [49.4, 43.0]
measured = false

[[lasers]]
number = 5
wavelength_nm = 785
servo_angle_deg = 90
xy_centre_mm = [49.4, 43.0]
measured = false

[[lasers]]
number = 6
wavelength_nm = 848
servo_angle_deg = 30
xy_centre_mm = [50.0, 50.0]
measured = false

[geometry]
# Corner calibration is done under this laser; every other laser's
# position is taken relative to it (Phase 4).
reference_laser = 2
# XY carries the whole AB gantry, so moving XY moves the sample under the
# beam like moving AB does. These say along which AB axis, and which way:
# "+A" means X up moves the sample the same way as A up. Checked on the
# bench 2026-10-21 with laser 2 on a mark: +X and +A both move the mark
# up, +Y and +B both move it right, as the operator sees it; both stages
# home to the bottom-left (docs/hardware.md).
x_along = "+A"
y_along = "+B"
directions_measured = true
# Marlin lists 0.2 mm of X/Y backlash with correction 0, so every placing
# move ends moving up, from at least this far below. The AB value is
# above the 20 um the simulations assume.
xy_take_up_mm = 0.5
ab_take_up_mm = 0.1
# A/B backlash. Calibration reads AB after moving up, which puts the
# stage half the backlash below the reading; the serpentine alignment
# puts a map on where the stage really was. Half of this is added to
# aligned maps so the two agree. 0 until the bench measures it (Phase 4:
# the same rows at two speeds separate backlash from latency).
ab_backlash_mm = 0.0

[display]
# How the operator sees the cell (bench, 2026-10-23, with the reference
# photo's view): each row runs from the cell's right edge leftwards
# (+u, A) and the rows step downwards (+v, B), from the top-right corner.
# Map PNGs are drawn that way.
u_points = "left"
v_points = "down"

[photodiode]
# Hamamatsu S1223-01 (3.6 x 3.6 mm chip) under two scalpel blades whose
# edges cross over it, one quarter of the chip left open (docs/hardware.md).
channel = 2
# Where the blade edges cross, on the carriage: the AB position that
# would put it under a laser with XY at that laser's xy_centre_mm. Far
# outside AB's travel along A; XY makes up the rest. Measured across
# the blades by `multilbic commission` as laser 2 sees it (2026-10-30,
# 0.6.22), 0.25 mm from the estimate (58.44, 21.26). The first run that
# day passed away from the blades (the open side read the wrong way
# round, fixed in 0.6.21) and found the can window's far corner at
# (60.239, 23.062). Laser 1 reaches 4.9 mm past it along A with X to
# 103 and A to 39.5.
corner_ab_mm = [58.568, 21.016]  # commission 2026-10-30
# The open quarter is towards A- and B- of the corner as it sits on the
# carriage (as built): the way the carriage goes when A or B decreases.
# In the carriage frame that is larger A and B (`Photodiode.open_signs`).
open_a = "-"
open_b = "-"
chip_mm = 3.6
# The blade along B is at the sample's height; the blade along A sits
# on it, 0.4 mm higher (the blades' measured thickness).
blade_a_above_mm = 0.4
measured = true  # commission 2026-10-30

[laser_board]
# Wait after the servo turns, before the laser comes on. On the worst
# 120-degree swing, 1000 ms was stable and 500 ms slid (bench,
# 2026-10-20); 2000 keeps a wide margin for a few seconds per run
# (decision D10). The driver sets it at every open(), because the
# firmware forgets a runtime value on power-up.
settle_ms = 2000
# A laser stays off at least this long before it comes on again: laser 1
# relit after up to 1 s dark came back at 40 % and stayed there; 2 s or
# more gave full power (bench, 2026-10-27). The driver waits out the rest.
relight_ms = 3000

# Serial ports per platform (sys.platform). An empty string means "not
# configured", which is normal for a development machine.
#
# On the Pi these are the names Linux makes on its own under
# /dev/serial/by-id, from each board's USB serial number: they survive
# replugging and reboots, and need no udev rules (docs/hardware.md).
[ports.linux]
skr = "/dev/serial/by-id/usb-marlinfw.org_Marlin_USB_Device_1602400395D510E961DB1B78F50020C1-if00"
laser = "/dev/serial/by-id/usb-Seeed_Seeed_XIAO_M0_AC5401405154315432202020FF102436-if00"
tft = "/dev/serial/by-id/usb-FTDI_TTL232R-3V3_FTDKEIR6-if00-port0"
smu = "/dev/serial/by-id/usb-Undalogic_Inc_miniSMU_MS01_lunar-tuvok-7966-if00"

[ports.win32]
skr = ""
laser = ""
tft = ""
smu = ""

[serial]
baud = 115200
